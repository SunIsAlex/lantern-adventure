<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>提灯人 · 文字冒险</title>
<meta name="description" content="在黑暗中点亮一盏提灯——一个由 AI 即兴讲述的中文文字冒险，每一个选择都通向不同的结局。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --ink:          #0e0b08;
    --ink-2:        #161210;
    --ink-3:        #1f1916;
    --vellum:       #ece2cc;
    --vellum-dim:   #b9ad94;
    --vellum-muted: #786a55;
    --ember:        #d8923a;
    --ember-bright: #f3b35a;
    --blood:        #8a3a2a;
    --rule:         #3a2f24;
    --shadow:       0 30px 80px -20px rgba(0,0,0,.7), 0 4px 12px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 30% 0%, #2a1f17 0%, var(--ink) 55%) no-repeat,
      var(--ink);
    color: var(--vellum);
    font-family: 'Noto Serif SC', 'Cormorant Garamond', Georgia, serif;
    font-size: 17px;
    line-height: 1.85;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(236,226,204,.04) 1px, transparent 0);
    background-size: 3px 3px;
    z-index: 1;
    mix-blend-mode: overlay;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 200px 40px rgba(0,0,0,.65);
    z-index: 2;
  }

  .stage {
    position: relative;
    z-index: 3;
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 28px 120px;
  }

  /* ---------- Header ---------- */
  header.masthead {
    text-align: center;
    margin-bottom: 56px;
    position: relative;
  }
  .ornament {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    color: var(--ember);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    letter-spacing: .25em;
    text-transform: uppercase;
    font-size: 11px;
    opacity: .85;
  }
  .ornament::before, .ornament::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rule), transparent);
    max-width: 90px;
  }
  h1.title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(46px, 8vw, 72px);
    line-height: 1;
    margin: 18px 0 4px;
    color: var(--vellum);
    letter-spacing: -.01em;
  }
  h1.title .amp {
    font-style: italic;
    color: var(--ember);
    font-weight: 400;
  }
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--vellum-dim);
    margin: 0;
  }

  /* ---------- Panels ---------- */
  .panel {
    background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 28px 26px 30px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .panel::before {
    content: '';
    position: absolute; inset: 4px;
    border: 1px solid rgba(216,146,58,.18);
    border-radius: 1px;
    pointer-events: none;
  }
  .panel h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 6px;
    color: var(--ember-bright);
    letter-spacing: .02em;
  }
  .panel p.hint {
    margin: 0 0 18px;
    color: var(--vellum-muted);
    font-size: 14px;
    line-height: 1.6;
  }
  .field { margin-bottom: 14px; }
  label.field-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--vellum-muted);
    margin-bottom: 6px;
  }
  input.text, textarea.text {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--rule);
    color: var(--vellum);
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    padding: 11px 13px;
    border-radius: 2px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    resize: vertical;
  }
  input.text:focus, textarea.text:focus {
    border-color: var(--ember);
    box-shadow: 0 0 0 1px rgba(216,146,58,.3);
  }

  .genre-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 4px;
  }
  .chip {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--vellum-dim);
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { color: var(--vellum); border-color: var(--vellum-muted); }
  .chip.on {
    color: var(--ember-bright);
    border-color: var(--ember);
    background: rgba(216,146,58,.08);
  }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    background: linear-gradient(180deg, var(--ember), #b77527);
    color: #1a0f04;
    border: 1px solid #6b4112;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .04em;
    padding: 12px 22px;
    border-radius: 2px;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s, filter .2s;
    box-shadow: 0 4px 14px rgba(216,146,58,.25);
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled {
    filter: grayscale(.6) brightness(.6);
    cursor: not-allowed;
  }
  .btn.ghost {
    background: transparent;
    color: var(--vellum-dim);
    border: 1px solid var(--rule);
    box-shadow: none;
    font-size: 14px;
    padding: 8px 14px;
  }
  .btn.ghost:hover:not(:disabled) { color: var(--vellum); border-color: var(--vellum-muted); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---------- Resume card ---------- */
  .resume-card {
    background: rgba(216,146,58,.06);
    border: 1px solid rgba(216,146,58,.35);
    border-radius: 2px;
    padding: 18px 20px;
    margin-bottom: 22px;
    position: relative;
  }
  .resume-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 19px;
    margin: 0 0 4px;
    color: var(--ember-bright);
  }
  .resume-card .resume-meta {
    font-size: 12.5px;
    color: var(--vellum-muted);
    margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .04em;
  }
  .resume-card .resume-excerpt {
    font-style: italic;
    color: var(--vellum-dim);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 14px;
    border-left: 2px solid var(--ember);
    padding-left: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }


  /* ---------- Status / loading ---------- */
  .status {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--vellum-dim);
    margin: 18px 0;
    font-size: 16px;
    /* Lantern flicker: irregular brightness + warm glow that wavers like a
       candle. The asymmetric keyframe stops keep it from looking metronomic. */
    animation: lantern-flicker 3.2s infinite ease-in-out;
  }
  .status .dots span {
    display: inline-block;
    animation: blink 1.4s infinite both;
  }
  .status .dots span:nth-child(2) { animation-delay: .2s; }
  .status .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  @keyframes lantern-flicker {
    0%   { opacity: 1;    text-shadow: 0 0 8px rgba(243,179,90,.45); }
    14%  { opacity: .68;  text-shadow: 0 0 3px rgba(243,179,90,.15); }
    29%  { opacity: .95;  text-shadow: 0 0 7px rgba(243,179,90,.40); }
    42%  { opacity: .55;  text-shadow: 0 0 2px rgba(243,179,90,.10); }
    57%  { opacity: 1;    text-shadow: 0 0 9px rgba(243,179,90,.50); }
    71%  { opacity: .78;  text-shadow: 0 0 5px rgba(243,179,90,.25); }
    85%  { opacity: .92;  text-shadow: 0 0 6px rgba(243,179,90,.35); }
    100% { opacity: 1;    text-shadow: 0 0 8px rgba(243,179,90,.45); }
  }

  .error {
    background: rgba(138,58,42,.12);
    border: 1px solid var(--blood);
    color: #f0c2b3;
    padding: 12px 14px;
    border-radius: 2px;
    font-size: 14px;
    margin: 16px 0;
  }


  footer {
    text-align: center;
    margin-top: 60px;
    color: var(--vellum-muted);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .15em;
  }
  footer a { color: var(--ember); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .hidden { display: none !important; }
</style>
<link rel="stylesheet" href="./styles.css" />
<script src="./app.js" defer></script>
</head>
<body>
<main class="stage">

  <header class="masthead">
    <div class="ornament">A Text Adventure</div>
    <h1 class="title">提<span class="amp">灯</span>人</h1>
    <p class="tagline">A lantern in the dark — your story begins where you choose.</p>
  </header>

  <!-- ===================== SETUP ===================== -->
  <section id="setup" class="panel">
    <div id="resumeCard" class="resume-card hidden">
      <h3>未完的故事还亮着光</h3>
      <div class="resume-meta" id="resumeMeta"></div>
      <div class="resume-excerpt" id="resumeExcerpt"></div>
      <div class="row">
        <button id="resumeBtn" class="btn" style="font-size:15px;padding:9px 18px;">继续</button>
        <button id="discardBtn" class="btn ghost">丢弃，开始新故事</button>
      </div>
    </div>

    <h2>开启一段新的旅程</h2>
    <p class="hint">
      由 DeepSeek V4 Pro 即兴讲述。你可以选择题材、留下一句灵感，或者什么都不写、让命运自己抽签。
    </p>

    <div class="field">
      <label class="field-label">题材（可选）</label>
      <div class="genre-chips" id="chips">
        <button type="button" class="chip" data-g="">随机</button>
        <button type="button" class="chip" data-g="蒸汽朋克">蒸汽朋克</button>
        <button type="button" class="chip" data-g="赛博朋克">赛博朋克</button>
        <button type="button" class="chip" data-g="克苏鲁">克苏鲁</button>
        <button type="button" class="chip" data-g="武侠">武侠</button>
        <button type="button" class="chip" data-g="废土">废土</button>
        <button type="button" class="chip" data-g="维多利亚">维多利亚</button>
        <button type="button" class="chip" data-g="太空歌剧">太空歌剧</button>
        <button type="button" class="chip" data-g="北欧神话">北欧神话</button>
        <button type="button" class="chip" data-g="异世界">异世界</button>
        <button type="button" class="chip" data-g="魔法校园">魔法校园</button>
        <button type="button" class="chip" data-g="穿越">穿越</button>
        <button type="button" class="chip" data-g="历史架空">历史架空</button>
        <button type="button" class="chip" data-g="东方奇幻">东方奇幻</button>
        <button type="button" class="chip" data-g="都市异能">都市异能</button>
        <button type="button" class="chip" data-g="反乌托邦">反乌托邦</button>
        <button type="button" class="chip" data-g="西部">西部</button>
        <button type="button" class="chip" data-g="海盗">海盗</button>
        <button type="button" class="chip" data-g="仙侠">仙侠</button>
        <button type="button" class="chip" data-g="规则怪谈">规则怪谈</button>
        <button type="button" class="chip" data-g="中式恐怖">中式恐怖</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label">灵感种子（可选）</label>
      <input id="seed" class="text" type="text" maxlength="200"
        placeholder="例如：一只会说话的乌鸦、一封迟到了三十年的信、地下铁的最后一班车……" />
    </div>

    <div class="row" style="margin-top: 18px;">
      <button id="startBtn" class="btn">点亮提灯 ✦</button>
      <span id="setupStatus" class="status" style="margin: 0;"></span>
    </div>
    <div id="setupError" class="error hidden"></div>
  </section>

  <!-- ===================== GAME ===================== -->
  <section id="game" class="hidden">
    <div id="scroll" class="scroll"></div>

    <div id="loading" class="status hidden">
      笔尖正在润墨<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>

    <div id="gameError" class="error hidden"></div>

    <div id="endingStamp" class="ending-stamp hidden">F I N</div>

    <div id="choicesWrap" class="hidden">
      <div id="choices" class="choices"></div>

      <div class="freeform">
        <label>……或者，写下你想做的事</label>
        <div class="row">
          <input id="freeInput" class="text" type="text" maxlength="200"
            placeholder="例如：我假装认识他，伸手拥抱过去" />
          <button id="freeBtn" class="btn ghost" style="font-size:14px;padding:9px 16px;">提交</button>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button id="shareBtn" class="btn ghost" title="生成可分享的链接（不会泄露你的 API Key）">
        ⤴ 分享当前进度
      </button>
      <button id="restartBtn" class="btn ghost">↺ 重新开始一段新故事</button>
    </div>
  </section>

  <div id="toast" class="toast"></div>


</body>
</html>
